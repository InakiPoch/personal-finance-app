<div class="mx-auto max-w-184 px-5 py-10 sm:px-8">
  <header class="mb-10">
    <p class="font-serif text-sm italic text-stamp">Personal ledger</p>
    <h1 class="mt-1 font-serif text-2xl font-medium tracking-tight text-heading">Money Flow</h1>
    <p class="mt-3 max-w-[52ch] text-[0.8125rem] leading-relaxed text-ink-faint text-pretty">
      Every movement of your own money this month — what came in, and what went out.
    </p>
  </header>
  <div class="mb-6 flex flex-wrap items-baseline justify-between gap-x-4 gap-y-2">
    <a routerLink="/ledger/incomes/new" class="text-xs font-medium text-stamp hover:underline">
      Record income
    </a>
    <label class="flex items-baseline gap-2 text-xs text-ink-faint">
      <span class="uppercase tracking-[0.12em]">Month</span>
      <input
        type="month"
        id="month"
        name="month"
        #monthInput
        [value]="selectedMonth()"
        (change)="onMonthChange(monthInput.value)"
        class="border-b border-rule bg-transparent pb-0.5 font-sans text-xs text-ink-soft outline-none focus-visible:border-stamp"
      />
    </label>
  </div>
  @if(loadStatus() === 'loading') {
    <p class="text-sm text-ink-faint">Totalling the month…</p>
  } @else if(loadStatus() === 'error') {
    <p class="text-sm text-negative" role="alert">Could not load the money flow — try again in a moment.</p>
  } @else {
    <app-money-flow-table [rows]="rows()" [footerTotals]="footerTotals()" />
  }
</div>
